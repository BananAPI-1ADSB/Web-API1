<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/sessao.js"></script>
    <title>BananaAPI - Cadastro de Endereço</title>
  </head>
  <body>
    <div id="header" class="header"></div>

    <div class="login">
      <div class="container">
        <div class="card card-cadastro">
          <h2>Cadastro de Endereço</h2>
          <div class="formulario">

            <div class="campo">
              <label for="cep_endereco">CEP:</label>
              <input
                id="cep_endereco"
                type="text"
                placeholder="00000-000"
                maxlength="9"
                oninput="limparErro('cep_endereco')"
              />
              <span class="erro" id="erro_cep_endereco"></span>
            </div>

            <div class="campo">
              <label for="rua_endereco">Rua:</label>
              <input
                id="rua_endereco"
                type="text"
                placeholder="Nome da rua"
                oninput="limparErro('rua_endereco')"
              />
              <span class="erro" id="erro_rua_endereco"></span>
            </div>

            <div class="campo">
              <label for="numero_endereco">Número:</label>
              <input
                id="numero_endereco"
                type="text"
                placeholder="Ex: 100"
                oninput="limparErro('numero_endereco')"
              />
              <span class="erro" id="erro_numero_endereco"></span>
            </div>

            <div class="campo">
              <label for="bairro_endereco">Bairro:</label>
              <input
                id="bairro_endereco"
                type="text"
                placeholder="Nome do bairro"
                oninput="limparErro('bairro_endereco')"
              />
              <span class="erro" id="erro_bairro_endereco"></span>
            </div>

            <div class="campo">
              <label for="cidade_endereco">Cidade:</label>
              <input
                id="cidade_endereco"
                type="text"
                placeholder="Nome da cidade"
                oninput="limparErro('cidade_endereco')"
              />
              <span class="erro" id="erro_cidade_endereco"></span>
            </div>

            <div class="campo">
              <label for="estado_endereco">Estado (UF):</label>
              <input
                id="estado_endereco"
                type="text"
                placeholder="SP"
                maxlength="2"
                oninput="limparErro('estado_endereco')"
              />
              <span class="erro" id="erro_estado_endereco"></span>
            </div>

            <div class="campo">
              <label for="complemento_endereco">Complemento:</label>
              <input
                id="complemento_endereco"
                type="text"
                placeholder="Bloco, Sala, Galpão... (opcional)"
              />
            </div>

            <div class="campo">
              <label for="fk_empresa_end">ID da Empresa:</label>
              <input
                id="fk_empresa_end"
                type="number"
                placeholder="ID da empresa (opcional)"
                oninput="limparErro('fk_vinculo')"
              />
            </div>

            <div class="campo">
              <label for="fk_entreposto_end">ID do Entreposto:</label>
              <input
                id="fk_entreposto_end"
                type="number"
                placeholder="ID do entreposto (opcional)"
                oninput="limparErro('fk_vinculo')"
              />
              <span class="erro" id="erro_fk_vinculo"></span>
            </div>

            <button type="button" class="botao" onclick="validarEndereco()">
              Cadastrar Endereço
            </button>

            <p class="login-link">
              Precisa cadastrar um entreposto?
              <a href="cadastro-entreposto.html">Clique aqui</a>
            </p>

          </div>
        </div>
      </div>
    </div>

    <script src="js/fetch.js"></script>
    <script>
      window.onload = () => {
        headerSessao()
      }
      function validarEndereco() {
        let isValido = true;

        if (cep_endereco.value.trim() === "") {
          erro_cep_endereco.innerHTML = "CEP é obrigatório";
          cep_endereco.classList.add("input-erro");
          isValido = false;
        } else {
          erro_cep_endereco.innerHTML = "";
          cep_endereco.classList.remove("input-erro");
        }

        if (rua_endereco.value.trim() === "") {
          erro_rua_endereco.innerHTML = "Rua é obrigatória";
          rua_endereco.classList.add("input-erro");
          isValido = false;
        } else {
          erro_rua_endereco.innerHTML = "";
          rua_endereco.classList.remove("input-erro");
        }

        if (numero_endereco.value.trim() === "") {
          erro_numero_endereco.innerHTML = "Número é obrigatório";
          numero_endereco.classList.add("input-erro");
          isValido = false;
        } else {
          erro_numero_endereco.innerHTML = "";
          numero_endereco.classList.remove("input-erro");
        }

        if (bairro_endereco.value.trim() === "") {
          erro_bairro_endereco.innerHTML = "Bairro é obrigatório";
          bairro_endereco.classList.add("input-erro");
          isValido = false;
        } else {
          erro_bairro_endereco.innerHTML = "";
          bairro_endereco.classList.remove("input-erro");
        }

        if (cidade_endereco.value.trim() === "") {
          erro_cidade_endereco.innerHTML = "Cidade é obrigatória";
          cidade_endereco.classList.add("input-erro");
          isValido = false;
        } else {
          erro_cidade_endereco.innerHTML = "";
          cidade_endereco.classList.remove("input-erro");
        }

        if (estado_endereco.value.trim() === "") {
          erro_estado_endereco.innerHTML = "Estado é obrigatório";
          estado_endereco.classList.add("input-erro");
          isValido = false;
        } else if (estado_endereco.value.trim().length < 2) {
          erro_estado_endereco.innerHTML = "Informe a sigla com 2 letras";
          estado_endereco.classList.add("input-erro");
          isValido = false;
        } else {
          erro_estado_endereco.innerHTML = "";
          estado_endereco.classList.remove("input-erro");
        }

        if (fk_empresa_end.value.trim() === "" && fk_entreposto_end.value.trim() === "") {
          erro_fk_vinculo.innerHTML = "Informe ao menos o ID de uma empresa ou entreposto";
          isValido = false;
        } else {
          erro_fk_vinculo.innerHTML = "";
        }

        if (isValido) {
          fetchCadastrarEndereco();
        }
      }
    </script>
  </body>
</html>
