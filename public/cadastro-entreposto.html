<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/sessao.js"></script>
    <title>BananaAPI - Cadastro de Entreposto</title>
  </head>
  <body>
    <div id="header" class="header"></div>


    <div class="login">
      <div class="container">
        <div class="card card-cadastro">
          <h2>Cadastro de Entreposto</h2>
          <div class="formulario">

            <div class="campo">
              <label for="nome_entreposto">Nome do Entreposto:</label>
              <input
                id="nome_entreposto"
                type="text"
                placeholder="Ex: Entreposto Central SP"
                oninput="limparErro('nome_entreposto')"
              />
              <span class="erro" id="erro_nome_entreposto"></span>
            </div>

            <div class="campo">
              <label for="fk_empresa">ID da Empresa:</label>
              <input
                id="fk_empresa"
                type="number"
                placeholder="Informe o ID da empresa vinculada"
                oninput="limparErro('fk_empresa')"
              />
              <span class="erro" id="erro_fk_empresa"></span>
            </div>

            <button type="button" class="botao" onclick="validarEntreposto()">
              Cadastrar Entreposto
            </button>

            <p class="login-link">
              Quer cadastrar uma empresa?
              <a href="cadastro-empresa.html">Cadastre aqui</a>
            </p>

          </div>
        </div>
      </div>
    </div>

    <script src="js/fetch.js"></script>
    <script>
      window.onload = () => {
        headerSessao()
      }
      function validarEntreposto() {
        let isValido = true;

        if (nome_entreposto.value.trim() === "") {
          erro_nome_entreposto.textContent = "Nome é obrigatório";
          nome_entreposto.classList.add("input-erro");
          isValido = false;
        } else {
          erro_nome_entreposto.textContent = "";
          nome_entreposto.classList.remove("input-erro");
        }

        if (fk_empresa.value.trim() === "") {
          erro_fk_empresa.textContent = "ID da empresa é obrigatório";
          fk_empresa.classList.add("input-erro");
          isValido = false;
        } else {
          erro_fk_empresa.textContent = "";
          fk_empresa.classList.remove("input-erro");
        }

        if (isValido) {
          fetchCadastrarEntreposto();
        }
      }
    </script>
  </body>
</html>
