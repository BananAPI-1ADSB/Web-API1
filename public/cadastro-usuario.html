<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="./js/fetch.js"></script>
    <script src="js/sessao.js"></script>
    <script src="js/limparErro.js"></script>
    <title>BananaAPI - Autenticação</title>
    <style>
      .form-hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="header" id="header"></div>

    <div class="login">
      <div class="container">
        <div class="card card-cadastro">
          <!-- CADASTRO -->
          <div id="form_cadastro">
            <h2>Criar Conta</h2>
            <div class="formulario">
              <div class="campo">
                <label for="nome_cadastro">Nome Completo:</label>
                <input
                  id="nome_cadastro"
                  type="text"
                  placeholder="Seu nome completo"
                  oninput="limparErro('nome_cadastro')"
                />
                <span class="erro" id="erro_nome_cadastro"></span>
              </div>
              <div class="campo">
                <label for="email_cadastro">E-mail:</label>
                <input
                  id="email_cadastro"
                  type="email"
                  placeholder="seuemail@provedor.com"
                  oninput="limparErro('email_cadastro')"
                />
                <span class="erro" id="erro_email_cadastro"></span>
              </div>
              <div class="campo">
                <label for="empresa_cadastro">ID da Empresa:</label>
                <input
                  id="empresa_cadastro"
                  type="text"
                  placeholder="informe o ID da sua empresa"
                  oninput="limparErro('empresa_cadastro')"
                />
                <span class="erro" id="erro_empresa_cadastro"></span>
              </div>
              <div class="campo">
                <label for="telefone_cadastro">Telefone:</label>
                <input
                  id="telefone_cadastro"
                  type="tel"
                  placeholder="(XX) 9XXXX-XXXX"
                  oninput="limparErro('telefone_cadastro')"
                />
                <span class="erro" id="erro_telefone_cadastro"></span>
              </div>
              <div class="campo">
                <label for="senha_cadastro">Senha:</label>
                <input
                  id="senha_cadastro"
                  type="password"
                  placeholder="••••••"
                  oninput="limparErro('senha_cadastro')"
                />
                <span class="erro" id="erro_senha_cadastro"></span>
              </div>
              <div class="campo">
                <label for="confirmacao_senha_cadastro"
                  >Confirmação da Senha:</label
                >
                <input
                  id="confirmacao_senha_cadastro"
                  type="password"
                  placeholder="••••••"
                  oninput="limparErro('confirmacao_cadastro')"
                />
                <span class="erro" id="erro_confirmacao_cadastro"></span>
              </div>
              <button type="button" class="botao" onclick="validarCadastro()">
                Criar Conta
              </button>
              <p class="login-link">
                Não possui codigo da empresa?
                <a href="cadastro-empresa.html">Cadastre sua empresa!</a>
              </p>
              <p class="login-link">
                Já possui conta?
                <a href="login.html">Faça login aqui!</a>
              </p>
            </div>
          </div>

        </div>
      </div>
    </div>

    <script>
      window.onload = () => {
        headerSessao()
      }
      let usuarioRegistrado = null;

      function alternarForm() {
        document
          .getElementById("form_cadastro")
          .classList.toggle("form-hidden");
        document.getElementById("form_login").classList.toggle("form-hidden");
      }

      empresa_cadastro.value = sessionStorage.ID_EMPRESA

      function validarCadastro() {
        let isValido = true;

        // Validar nome
        if (nome_cadastro.value.trim() === "") {
          erro_nome_cadastro.innerHTML = "Nome é obrigatório";
          nome_cadastro.classList.add("input-erro");
          isValido = false;
        } else if (nome_cadastro.value.trim().length < 3) {
          erro_nome_cadastro.innerHTML =
            "Nome deve ter pelo menos 3 caracteres";
          nome_cadastro.classList.add("input-erro");
          isValido = false;
        } else {
          erro_nome_cadastro.innerHTML = "";
          nome_cadastro.classList.remove("input-erro");
        }

        // Validar email
        if (email_cadastro.value.trim() === "") {
          erro_email_cadastro.innerHTML = "E-mail é obrigatório";
          email_cadastro.classList.add("input-erro");
          isValido = false;
        } else if (
          !email_cadastro.value.includes("@") ||
          !email_cadastro.value.includes(".")
        ) {
          erro_email_cadastro.innerHTML = "E-mail inválido";
          email_cadastro.classList.add("input-erro");
          isValido = false;
        } else {
          erro_email_cadastro.innerHTML = "";
          email_cadastro.classList.remove("input-erro");
        }

        // Validar empresa
        if (empresa_cadastro.value.trim() === "") {
          erro_empresa_cadastro.innerHTML = "Empresa é obrigatória";
          empresa_cadastro.classList.add("input-erro");
          isValido = false;
        } else {
          erro_empresa_cadastro.innerHTML = "";
          empresa_cadastro.classList.remove("input-erro");
        }

        // Validar telefone
        if (telefone_cadastro.value.trim() === "") {
          erro_telefone_cadastro.innerHTML = "Telefone é obrigatório";
          telefone_cadastro.classList.add("input-erro");
          isValido = false;
        } else if (telefone_cadastro.value.trim().length < 10) {
          erro_telefone_cadastro.innerHTML = "Telefone inválido";
          telefone_cadastro.classList.add("input-erro");
          isValido = false;
        } else {
          erro_telefone_cadastro.innerHTML = "";
          telefone_cadastro.classList.remove("input-erro");
        }

        // Validar senha
        if (senha_cadastro.value === "") {
          erro_senha_cadastro.innerHTML = "Senha é obrigatória";
          senha_cadastro.classList.add("input-erro");
          isValido = false;
        } else if (senha_cadastro.value.length < 6) {
          erro_senha_cadastro.innerHTML =
            "Senha deve ter pelo menos 6 caracteres";
          senha_cadastro.classList.add("input-erro");
          isValido = false;
        } else {
          erro_senha_cadastro.innerHTML = "";
          senha_cadastro.classList.remove("input-erro");
        }

        // Validar confirmação de senha
        if (confirmacao_senha_cadastro.value === "") {
          erro_confirmacao_cadastro.innerHTML =
            "Confirmação de senha é obrigatória";
          confirmacao_senha_cadastro.classList.add("input-erro");
          isValido = false;
        } else if (confirmacao_senha_cadastro.value !== senha_cadastro.value) {
          erro_confirmacao_cadastro.innerHTML = "As senhas não conferem";
          confirmacao_senha_cadastro.classList.add("input-erro");
          isValido = false;
        } else {
          erro_confirmacao_cadastro.innerHTML = "";
          confirmacao_senha_cadastro.classList.remove("input-erro");
        }

        if (isValido) {
          fetchCadastrarUsuario();

          // Limpar formulário de cadastro
          nome_cadastro.value = "";
          email_cadastro.value = "";
          empresa_cadastro.value = "";
          telefone_cadastro.value = "";
          senha_cadastro.value = "";
          confirmacao_senha_cadastro.value = "";
        }
      }

    </script>
  </body>
</html>
