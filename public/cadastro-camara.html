<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/sessao.js"></script>
    <script src="js/limparErro.js"></script>
    <title>BananaAPI - Cadastro de Câmera</title>
  </head>
  <body>
    <div id="header" class="header"></div>

    <div class="login">
      <div class="container">
        <div class="card card-cadastro">
          <h2>Cadastro de Câmera</h2>
          <div class="formulario">

            <div class="campo">
              <label for="nome_camara">Nome da Câmara:</label>
              <input
                id="nome_camara"
                type="text"
                placeholder="Ex: Câmara Corredor Principal"
                oninput="limparErro('nome_camara')"
              />
              <span class="erro" id="erro_nome_camara"></span>
            </div>

            <div class="campo">
              <label for="tipo_camara">Tipo:</label>
              <input
                id="tipo_camara"
                type="text"
                placeholder="Ex: fixa, dome, PTZ"
                oninput="limparErro('tipo_camara')"
              />
              <span class="erro" id="erro_tipo_camara"></span>
            </div>

            <div class="campo">
              <label for="fk_entreposto">ID do Entreposto:</label>
              <select name="fk_entreposto_end" id="fk_entreposto_end"></select>
              <!-- <input
                id="fk_entreposto"
                type="number"
                placeholder="Informe o ID do entreposto vinculado"
                oninput="limparErro('fk_entreposto')"
              /> -->
              <span class="erro" id="erro_fk_entreposto"></span>
            </div>

            <button type="button" class="botao" onclick="validarCamera()">
              Cadastrar Câmera
            </button>

            <p class="login-link">
              Quer cadastrar um sensor?
              <a href="cadastro-sensor.html">Cadastre aqui</a>
            </p>

          </div>
        </div>
      </div>
    </div>

    <script src="js/fetch.js"></script>
    <script>
      window.onload = () => {
        headerSessao()
      }

      fetchEntrepostosCadastrados()

      function validarCamera() {
        let isValido = true;

        if (nome_camara.value.trim() === "") {
          erro_nome_camara.innerHTML = "Nome é obrigatório";
          nome_camara.classList.add("input-erro");
          isValido = false;
        } else {
          erro_nome_camara.innerHTML = "";
          nome_camara.classList.remove("input-erro");
        }

        if (tipo_camara.value.trim() === "") {
          erro_tipo_camara.innerHTML = "Tipo é obrigatório";
          tipo_camara.classList.add("input-erro");
          isValido = false;
        } else {
          erro_tipo_camara.innerHTML = "";
          tipo_camara.classList.remove("input-erro");
        }

        // if (fk_entreposto.value.trim() === "") {
        //   erro_fk_entreposto.innerHTML = "ID do entreposto é obrigatório";
        //   fk_entreposto.classList.add("input-erro");
        //   isValido = false;
        // } else {
        //   erro_fk_entreposto.innerHTML = "";
        //   fk_entreposto.classList.remove("input-erro");
        // }

        if (isValido) {
          fetchCadastrarCamara();
        }
      }
    </script>
  </body>
</html>
