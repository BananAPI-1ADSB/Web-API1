<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/sessao.js"></script>
    <title>BananaAPI - Cadastro de Câmera</title>
  </head>
  <body>
    <div id="header" class="header"></div>

    <div class="login">
      <div class="container">
        <div class="card card-cadastro">
          <h2>Cadastro de Câmera</h2>
          <div class="formulario">

            <div class="campo">
              <label for="nome_camera">Nome da Câmera:</label>
              <input
                id="nome_camera"
                type="text"
                placeholder="Ex: Câmera Corredor Principal"
                oninput="limparErro('nome_camera')"
              />
              <span class="erro" id="erro_nome_camera"></span>
            </div>

            <div class="campo">
              <label for="tipo_camera">Tipo:</label>
              <input
                id="tipo_camera"
                type="text"
                placeholder="Ex: fixa, dome, PTZ"
                oninput="limparErro('tipo_camera')"
              />
              <span class="erro" id="erro_tipo_camera"></span>
            </div>

            <div class="campo">
              <label for="fk_entreposto">ID do Entreposto:</label>
              <input
                id="fk_entreposto"
                type="number"
                placeholder="Informe o ID do entreposto vinculado"
                oninput="limparErro('fk_entreposto')"
              />
              <span class="erro" id="erro_fk_entreposto"></span>
            </div>

            <button type="button" class="botao" onclick="validarCamera()">
              Cadastrar Câmera
            </button>

            <p class="login-link">
              Quer cadastrar um sensor?
              <a href="cadastro-sensor.html">Cadastre aqui</a>
            </p>

          </div>
        </div>
      </div>
    </div>

    <script src="js/fetch.js"></script>
    <script>
      window.onload = () => {
        headerSessao()
      }
      function validarCamera() {
        let isValido = true;

        if (nome_camera.value.trim() === "") {
          erro_nome_camera.innerHTML = "Nome é obrigatório";
          nome_camera.classList.add("input-erro");
          isValido = false;
        } else {
          erro_nome_camera.innerHTML = "";
          nome_camera.classList.remove("input-erro");
        }

        if (tipo_camera.value.trim() === "") {
          erro_tipo_camera.innerHTML = "Tipo é obrigatório";
          tipo_camera.classList.add("input-erro");
          isValido = false;
        } else {
          erro_tipo_camera.innerHTML = "";
          tipo_camera.classList.remove("input-erro");
        }

        if (fk_entreposto.value.trim() === "") {
          erro_fk_entreposto.innerHTML = "ID do entreposto é obrigatório";
          fk_entreposto.classList.add("input-erro");
          isValido = false;
        } else {
          erro_fk_entreposto.innerHTML = "";
          fk_entreposto.classList.remove("input-erro");
        }

        if (isValido) {
          fetchCadastrarCamera();
        }
      }
    </script>
  </body>
</html>
