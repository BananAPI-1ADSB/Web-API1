<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>BananaAPI - Cadastro de Empresa</title>
  </head>
  <body>
    <div class="header">
      <div class="container">
        <a href="home.html">
          <h1 class="titulo">BananaAPI</h1>
        </a>
        <ul class="navbar">
          <li><span><a href="home.html">Inicial</a></span></li>
          <li>|</li>
          <li><span><a href="calculadora.html">Financeiro</a></span></li>
          <li>|</li>
          <li><span><a href="">Monitoramento</a></span></li>
        </ul>
      </div>
    </div>

    <div class="login">
      <div class="container">
        <div class="card card-cadastro">
          <h2>Cadastro de Empresa</h2>
          <div class="formulario">

            <div class="campo">
              <label for="nome_empresa">Nome da Empresa:</label>
              <input
                id="nome_empresa"
                type="text"
                placeholder="Razão social da empresa"
                oninput="limparErro('nome_empresa')"
              />
              <span class="erro" id="erro_nome_empresa"></span>
            </div>

            <div class="campo">
              <label for="cnpj_empresa">CNPJ:</label>
              <input
                id="cnpj_empresa"
                type="text"
                placeholder="00.000.000/0000-00"
                maxlength="18"
                oninput="limparErro('cnpj_empresa')"
              />
              <span class="erro" id="erro_cnpj_empresa"></span>
            </div>

            <button type="button" class="botao" onclick="validarEmpresa()">
              Cadastrar Empresa
            </button>

            <p class="login-link">
              Já possui conta?
              <a href="auth.html">Faça login aqui</a>
            </p>

          </div>
        </div>
      </div>
    </div>

    <script src="js/fetch.js"></script>
    <script>
      function validarEmpresa() {
        let isValido = true;

        if (nome_empresa.value.trim() === "") {
          erro_nome_empresa.textContent = "Nome é obrigatório";
          nome_empresa.classList.add("input-erro");
          isValido = false;
        } else {
          erro_nome_empresa.textContent = "";
          nome_empresa.classList.remove("input-erro");
        }

        if (cnpj_empresa.value.trim() === "") {
          erro_cnpj_empresa.textContent = "CNPJ é obrigatório";
          cnpj_empresa.classList.add("input-erro");
          isValido = false;
        } else if (cnpj_empresa.value.trim().length < 14) {
          erro_cnpj_empresa.textContent = "CNPJ inválido";
          cnpj_empresa.classList.add("input-erro");
          isValido = false;
        } else {
          erro_cnpj_empresa.textContent = "";
          cnpj_empresa.classList.remove("input-erro");
        }

        if (isValido) {
          fetchCadastrarEmpresa();
        }
      }
    </script>
  </body>
</html>
